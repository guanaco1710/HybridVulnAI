name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar nmap (lo exigen los tests del escáner)
        run: sudo apt-get update && sudo apt-get install -y nmap
      - name: Instalar WeasyPrint (test del PDF) y coverage
        run: pip install weasyprint coverage
      - name: Ejecutar tests con cobertura
        run: coverage run -m unittest discover -s tests -t . -v
      - name: Exigir 100% de cobertura (líneas y ramas)
        run: coverage report
